plugins { id 'com.android.application' }

android {
    namespace 'com.anlan.guardian'
    compileSdk 34
    defaultConfig {
        applicationId 'com.anlan.guardian'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'tflite', 'onnx', 'bin' }
    sourceSets.androidTest.assets.srcDir(project(':core').file('src/androidTest/assets'))
    lint { abortOnError true }
}

dependencies {
    implementation 'org.jitsi.react:jitsi-meet-sdk:11.6.3'
    implementation files(rootProject.file('libs/sherpa-onnx-1.13.8.aar'))
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation project(':core')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

apply from: 'jitsi-chinese.gradle'
